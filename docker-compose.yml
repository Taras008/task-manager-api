x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  OVERDUE_INTERVAL_SECONDS: ${OVERDUE_INTERVAL_SECONDS:-60}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    command: ["python", "-m", "app.workers.overdue"]
    environment: *app-env
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # Heartbeat-файл свіжіший за 3 інтервали тіку (див. app/workers/heartbeat.py).
      test: ["CMD", "python", "-m", "app.workers.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  db_test:
    image: postgres:16
    # Лише для тестів: `make up` її не запускає (і не займає порт), `make test` — запускає явно.
    profiles: ["test"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
